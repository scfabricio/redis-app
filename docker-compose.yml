services:
  redis:
    image: redis:7.4-alpine
    container_name: redis-app
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: postgres-app
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    env_file:
      - .env

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
